<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Lake Wave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15" />
    </linearGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.35;
    }

    /* Dynamic / Animated Floating Elements */
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes waveMotion1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-50px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMotion2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }

    .wave1 {
      animation: waveMotion1 14s ease-in-out infinite;
    }
    .wave2 {
      animation: waveMotion2 18s ease-in-out infinite;
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    .p4 { animation: floatParticle 9s ease-in-out infinite 1.5s; }
    .p5 { animation: floatParticle 10s ease-in-out infinite 0.5s; }
    .pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Perspective Grid -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Light Sphere (behind text) -->
  <circle cx="600" cy="130" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="pulse-glow" />

  <!-- Dynamic Lake Waves (Background Layer) -->
  <g class="wave1">
    <path d="M-100,290 C200,240 400,320 700,270 C1000,220 1150,300 1350,260 L1350,360 L-100,360 Z" fill="url(#waveGrad1)" />
  </g>
  <g class="wave2">
    <path d="M-100,310 C150,270 450,340 750,290 C1050,240 1200,310 1350,280 L1350,360 L-100,360 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- Animated Floating Data Nodes / Particles (in background layer) -->
  <circle class="p1" cx="160" cy="110" r="4.5" fill="#38bdf8" />
  <circle class="p2" cx="280" cy="70" r="3" fill="#818cf8" />
  <circle class="p3" cx="980" cy="90" r="5" fill="#c084fc" />
  <circle class="p4" cx="1060" cy="150" r="3.5" fill="#38bdf8" />
  <circle class="p5" cx="880" cy="200" r="4" fill="#a855f7" />

  <!-- Foreground Content: Unobstructed & Centered -->
  <g>
    <!-- Category Pill -->
    <rect x="440" y="42" width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="458" cy="58" r="5" fill="#10b981" />
    <text x="472" y="63" class="badge-text" fill="#38bdf8">OPEN LAKEHOUSE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="title" filter="url(#glow)">Awesome Data Lake Platforms</text>

    <!-- Subtitle -->
    <text x="600" y="174" text-anchor="middle" class="subtitle">Curated Catalog of SaaS Engines, Open Table Formats &amp; Lakehouse Catalogs</text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(190, 208)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
        <text x="90" y="23" text-anchor="middle" class="badge-text">⚡ Apache Iceberg</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
        <text x="90" y="23" text-anchor="middle" class="badge-text">🌊 Delta Lake</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="90" y="23" text-anchor="middle" class="badge-text">🔥 Apache Hudi</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(630, 0)">
        <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
        <text x="90" y="23" text-anchor="middle" class="badge-text">🚀 Real-Time Paimon</text>
      </g>
    </g>
  </g>
</svg>
